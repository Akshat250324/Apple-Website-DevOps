services:

  web:
    build: .
    ports:
      - "8080:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apple_db
      POSTGRES_USER: apple_user
      POSTGRES_PASSWORD: apple_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    external: true
    name: apple_website_deployment_postgres_data