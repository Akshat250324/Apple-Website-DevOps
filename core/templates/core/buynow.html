{% extends "core/base.html" %}

{% block content %}
<br>
<div class="checkout-container">
    <div class="checkout-wrapper">
        <!-- Order Summary Section -->
        <div class="order-summary">
            <div class="summary-card">
                <div class="card-header">
                    <h2>Order Summary</h2>
                    <span class="order-badge">Secure Checkout</span>
                </div>
                <div class="card-content">
                    <div class="product-details">
                        <div class="product-row">
                            <div class="product-info">
                                <h4>{{apple.name}}</h4>
                                <span class="quantity">Quantity: 1</span>
                            </div>
                            <div class="product-price">${{apple.discounted_price}}</div>
                        </div>
                    </div>
                    <div class="price-breakdown">
                        <div class="price-row">
                            <span>Shipping Fee</span>
                            <span>$0</span>
                        </div>
                        <div class="price-row total">
                            <span>Total Amount</span>
                            <span>${{final_price}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delivery Address Section -->
        <div class="delivery-section">
            <h2>Select Delivery Address</h2>
            <form method="post" action="{% url 'buynowpayment' apple.id %}" class="address-form">
                {% csrf_token %}
                <div class="address-grid">
                    {% for add in address %}
                    <label class="address-card">
                        <input type="radio" name="buynow_selected_address" value="{{ add.id }}" checked>
                        <div class="address-content">
                            <div class="address-header">
                                <div class="name">{{add.name}}</div>
                                <div class="check-icon">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                            <div class="address-details">
                                <p>{{add.address}}</p>
                                <div class="address-meta">
                                    <span>{{add.city}}</span>
                                    <span>{{add.state}}</span>
                                    <span>{{add.pincode}}</span>
                                </div>
                            </div>
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <button type="submit" class="payment-button">
                    <i class="fas fa-lock"></i>
                    Proceed to Payment
                </button>
            </form>
        </div>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

.checkout-container {
    min-height: 100vh;
    padding: 60px 40px;
    background: linear-gradient(135deg, #f6f9fc 0%, #ffffff 100%);
}

.checkout-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 40px;
}

/* Order Summary Styles */
.summary-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(8, 17, 66, 0.06);
    overflow: hidden;
}

.card-header {
    padding: 30px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card-header h2 {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
}

.order-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    backdrop-filter: blur(4px);
}

.card-content {
    padding: 30px;
}

.product-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid #e2e8f0;
}

.product-info h4 {
    font-size: 18px;
    color: #1e293b;
    margin-bottom: 8px;
}

.quantity {
    color: #64748b;
    font-size: 14px;
}

.product-price {
    font-size: 20px;
    font-weight: 600;
    color: #2563eb;
}

.price-breakdown {
    margin-top: 20px;
}

.price-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    color: #64748b;
}

.price-row.total {
    border-top: 2px solid #e2e8f0;
    margin-top: 12px;
    padding-top: 20px;
    color: #1e293b;
    font-weight: 600;
    font-size: 20px;
}

/* Address Section Styles */
.delivery-section {
    padding: 30px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(8, 17, 66, 0.06);
}

.delivery-section h2 {
    margin-bottom: 30px;
    color: #1e293b;
}

.address-grid {
    display: grid;
    gap: 20px;
    margin-bottom: 30px;
}

.address-card {
    position: relative;
    padding: 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.address-card input[type="radio"] {
    display: none;
}

.address-card:hover {
    border-color: #2563eb;
    transform: translateY(-2px);
}

.address-card input[type="radio"]:checked + .address-content {
    border-color: #2563eb;
}

.address-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.name {
    font-size: 18px;
    font-weight: 600;
    color: #1e293b;
}

.check-icon {
    color: #2563eb;
    font-size: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.address-card input[type="radio"]:checked ~ .address-content .check-icon {
    opacity: 1;
}

.address-details p {
    color: #64748b;
    margin-bottom: 12px;
    line-height: 1.5;
}

.address-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.address-meta span {
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    color: #64748b;
}

.payment-button {
    width: 100%;
    padding: 16px 32px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.payment-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
}

@media (max-width: 1024px) {
    .checkout-wrapper {
        grid-template-columns: 1fr;
    }
    
    .checkout-container {
        padding: 20px;
    }
}
</style>

<!-- Add Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock content %}
