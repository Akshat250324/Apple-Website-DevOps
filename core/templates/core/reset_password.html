{% extends "core/base.html" %}

{% block content %}
<div class="reset-wrapper">
    <div class="reset-container">
        <div class="form-header">
            <div class="header-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Create New Password</h1>
            <p>Please enter your new password below</p>
        </div>

        <form action="" method="POST" novalidate class="reset-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    New Password
                </label>
                <div class="password-input">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="password2">
                    <i class="fas fa-lock"></i>
                    Confirm Password
                </label>
                <div class="password-input">
                    <input type="password" id="password2" name="password2" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-check-circle"></i>
                Reset Password
            </button>
        </form>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

.reset-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #f6f9fc 0%, #ffffff 100%);
}

.reset-container {
    max-width: 500px;
    width: 100%;
    background: white;
    border-radius: 30px;
    padding: 60px 40px;
    box-shadow: 0 30px 60px rgba(8, 17, 66, 0.08);
    animation: containerFloat 0.8s ease-out forwards;
    position: relative;
    overflow: hidden;
}

.reset-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #2563eb, #4f46e5);
}

.form-header {
    text-align: center;
    margin-bottom: 40px;
}

.header-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: white;
    font-size: 32px;
    animation: iconScale 0.6s ease-out 0.2s forwards;
    transform: scale(0.8);
    opacity: 0;
}

.form-header h1 {
    font-family: 'Poppins', sans-serif;
    color: #1e293b;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 10px;
    animation: fadeUp 0.6s ease-out 0.4s forwards;
    opacity: 0;
}

.form-header p {
    color: #64748b;
    font-size: 16px;
    animation: fadeUp 0.6s ease-out 0.6s forwards;
    opacity: 0;
}

.form-group {
    margin-bottom: 25px;
    animation: fadeUp 0.6s ease-out 0.8s forwards;
    opacity: 0;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: #1e293b;
    font-weight: 500;
    font-size: 16px;
}

.password-input {
    position: relative;
}

.password-input input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.password-input input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    outline: none;
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 0;
    font-size: 18px;
    transition: color 0.3s ease;
}

.toggle-password:hover {
    color: #2563eb;
}

.submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: fadeUp 0.6s ease-out 1s forwards;
    opacity: 0;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
}

@keyframes containerFloat {
    0% { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

@keyframes iconScale {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeUp {
    0% { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

@media (max-width: 768px) {
    .reset-container {
        padding: 40px 20px;
        margin: 20px;
    }

    .form-header h1 {
        font-size: 28px;
    }
}
</style>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script>
document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });
});
</script>
{% endblock content %}
