{% extends "core/base.html" %}

{% block content %}
<div class="reset-success-container">
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="success-content">
            <h1>Password Reset Email Sent</h1>
            <p>We've sent you an email with instructions to reset your password. Please check your inbox and follow the steps provided.</p>
            <a href="{% url 'index' %}" class="home-button">
                <i class="fas fa-home"></i>
                Return to Homepage
            </a>
        </div>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

.reset-success-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #f6f9fc 0%, #ffffff 100%);
}

.success-card {
    max-width: 600px;
    background: white;
    border-radius: 30px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(8, 17, 66, 0.08);
    animation: cardFloat 0.8s ease-out forwards;
    position: relative;
    overflow: hidden;
}

.success-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #2563eb, #4f46e5);
}

.success-icon {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 40px;
    animation: iconScale 0.6s ease-out 0.2s forwards;
    transform: scale(0.8);
    opacity: 0;
}

.success-icon i {
    font-size: 60px;
    color: white;
}

.success-content h1 {
    color: #1e293b;
    font-family: 'Poppins', sans-serif;
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease-out 0.4s forwards;
    opacity: 0;
    transform: translateY(20px);
}

.success-content p {
    color: #64748b;
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease-out 0.6s forwards;
    opacity: 0;
    transform: translateY(20px);
}

.home-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
    color: white;
    text-decoration: none;
    border-radius: 16px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 18px;
    transition: all 0.3s ease;
    animation: fadeUp 0.6s ease-out 0.8s forwards;
    opacity: 0;
    transform: translateY(20px);
}

.home-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
    color: white;
    text-decoration: none;
}

@keyframes cardFloat {
    0% { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

@keyframes iconScale {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeUp {
    0% { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

@media (max-width: 768px) {
    .success-card {
        padding: 40px 20px;
        margin: 20px;
    }

    .success-content h1 {
        font-size: 28px;
    }

    .success-content p {
        font-size: 16px;
    }

    .home-button {
        padding: 14px 28px;
        font-size: 16px;
    }
}
</style>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock content %}
